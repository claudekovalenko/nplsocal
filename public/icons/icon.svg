<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16243d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- four fields grid -->
  <g fill="none" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" opacity="0.92">
    <path d="M256 128 V384"/>
    <path d="M128 256 H384"/>
  </g>
  <circle cx="256" cy="256" r="44" fill="url(#sun)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#f8fafc" stroke-width="18" opacity="0.92"/>
