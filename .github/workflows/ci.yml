name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  audit:
    name: Interface audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Crawls every page, clicks the controls, and drives the critical
      # journeys. Builds without database credentials, so the form tests
      # write to the device rather than the live database.
      - run: npm run audit
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: ui-audit-report.json
          if-no-files-found: ignore
